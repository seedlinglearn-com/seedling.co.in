<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admission Registration Form | Seedling Institute of Learning</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --navy: #14365d;
      --green: #1e8449;
      --border: #1e293b;
      --tint: #f4f7fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px 10px 36px;
      background: #e2e8f0;
      font-family: Arial, Helvetica, sans-serif;
      color: #111111;
    }

    .toolbar {
      max-width: 820px;
      margin: 0 auto 12px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tool-btn {
      border: none;
      border-radius: 4px;
      padding: 8px 14px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .a4-sheet {
      max-width: 820px;
      max-height:100%;
      margin: 0 auto;
      background: #ffffff;
      border: 2.5px solid var(--navy);
      padding: 16px 20px 18px;
      position: relative;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    /* Subtle Center Watermark */
    .watermark {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-18deg);
      font-size: 46px;
      font-weight: 900;
      color: rgba(20, 54, 93, 0.055);
      letter-spacing: 3px;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }

    .sheet-inner {
      position: relative;
      z-index: 1;
    }

    /* Top Institute Banner matching admission_form.pdf */
    .top-header {
      display: grid;
      grid-template-columns: 76px 1fr 78px;
      gap: 10px;
      align-items: center;
      border-bottom: 2px solid var(--navy);
      padding-bottom: 10px;
    }

    .logo-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2.5px solid var(--green);
      background: #f3faf6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .logo-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .institute-title-block {
      text-align: center;
    }

    .kicker-line {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--green);
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    .main-title {
      margin: 2px 0;
      font-size: 19px;
      font-weight: 900;
      color: var(--navy);
      letter-spacing: 0.4px;
    }

    .tagline-pill {
      display: inline-block;
      background: var(--navy);
      color: #ffffff;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 999px;
      letter-spacing: 0.6px;
      margin: 2px 0 4px;
    }

    .badges-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 9.5px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 3px;
    }

    .badges-row span {
      border: 1px solid #94a3b8;
      background: #f8fafc;
      padding: 1px 6px;
      border-radius: 3px;
    }

    .address-line {
      font-size: 11px;
      color: #222222;
      line-height: 1.38;
      font-weight: 600;
    }

    .qr-box {
      width: 74px;
      height: 74px;
      border: 1.5px solid var(--navy);
      padding: 3px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Reg No, Reg Date & Student Photo Strip */
    .reg-strip {
      display: grid;
      grid-template-columns: 1fr 112px;
      gap: 12px;
      margin-top: 10px;
      align-items: stretch;
    }

    .reg-meta-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
    }

    .reg-meta-table th,
    .reg-meta-table td {
      border: 1.5px solid var(--border);
      padding: 7px 10px;
      text-align: left;
    }

    .reg-meta-table th {
      background: var(--tint);
      color: var(--navy);
      font-weight: 800;
      width: 18%;
      text-transform: uppercase;
      font-size: 10.5px;
    }

    .photo-frame {
      width: 112px;
      height: 126px;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 9.5px;
      font-weight: 700;
      color: #475569;
      overflow: hidden;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Main Structured Form Grid matching PDF fields */
    .form-grid-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 11.5px;
    }

    .form-grid-table th,
    .form-grid-table td {
      border: 1.5px solid var(--border);
      padding: 7px 9px;
      text-align: left;
      vertical-align: middle;
    }

    .form-grid-table th {
      background: var(--tint);
      color: var(--navy);
      font-weight: 800;
      text-transform: uppercase;
      font-size: 10.2px;
      letter-spacing: 0.2px;
    }

    .gender-boxes {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      font-weight: 700;
    }

    .g-box {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .g-check {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 1.5px solid #111;
      text-align: center;
      line-height: 13px;
      font-size: 11px;
      font-weight: 900;
    }

    .g-check.checked {
      background: var(--navy);
      color: #ffffff;
    }

    .section-divider {
      background: var(--navy);
      color: #ffffff;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.7px;
      padding: 4px 9px;
      margin-top: 8px;
      text-transform: uppercase;
    }

    .terms-box {
      margin-top: 10px;
      border: 1.5px solid var(--border);
      background: #fafafa;
      padding: 8px 10px;
      font-size: 10.2px;
      line-height: 1.45;
      color: #111111;
    }

    .terms-box strong.warn {
      color: #b91c1c;
    }

    .footer-sign-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-top: 26px;
      padding-top: 6px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .sign-line {
      width: 210px;
      border-top: 1.5px solid #111111;
      padding-top: 4px;
      text-align: center;
      font-size: 10.5px;
      text-transform: uppercase;
    }

    .thank-you-bar {
      margin-top: 12px;
      border-top: 1.5px dashed var(--navy);
      padding-top: 6px;
      text-align: center;
      font-size: 15px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: 0.4px;
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .no-print {
        display: none !important;
      }
      .a4-sheet {
        max-width: 100%;
        max-height:100%;
        box-shadow: none;
        border: 2px solid #000000;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar no-print">
    <strong style="color: #14365d;"><i class="fas fa-file-signature"></i> Student Admission Registration Form</strong>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button type="button" onclick="window.print()" class="tool-btn" style="background: #14365d;">
        <i class="fas fa-print"></i> Print Form
      </button>
      <button type="button" onclick="downloadAdmissionPDF()" class="tool-btn" style="background: #1e8449;">
        <i class="fas fa-file-pdf"></i> Download PDF
      </button>
      <button type="button" onclick="window.close()" class="tool-btn" style="background: #64748b;">
        <i class="fas fa-times"></i> Close Tab
      </button>
    </div>
  </div>

  <article id="admissionSheetContainer" class="a4-sheet"></article>

  <script>
    function getTargetStudent() {
      const params = new URLSearchParams(window.location.search);
      const idParam = params.get("id");
      const students = JSON.parse(localStorage.getItem("seedling_students") || "[]");

      if (idParam) {
        const matched = students.find(s => String(s.id).trim().toLowerCase() === String(idParam).trim().toLowerCase());
        if (matched) return matched;
      }

      const latest = JSON.parse(sessionStorage.getItem("latest_registered_student") || "null");
      if (latest) return latest;

      return students.length ? students[students.length - 1] : null;
    }

    function formatDisplayDate(val) {
      if (!val) return "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(val)) {
        const [y, m, d] = val.split("-");
        return `${d}/${m}/${y}`;
      }
      return val;
    }

    function formatPhoneWith91(phoneRaw) {
      const clean = String(phoneRaw || "").trim();
      if (!clean) return "+91 ";
      return clean.startsWith("+91") ? clean : `+91 ${clean}`;
    }

    function renderAdmissionSheet() {
      const container = document.getElementById("admissionSheetContainer");
      const stu = getTargetStudent();

      if (!stu) {
        container.innerHTML = "<p style='padding:20px;'>No student registration record found. Please register a student from the Admin Control Panel first.</p>";
        return;
      }

      const meta = stu.admissionMeta || {};
      const genderVal = String(meta.gender || "").trim().toUpperCase();
      const isM = genderVal === "M" || genderVal === "MALE";
      const isF = genderVal === "F" || genderVal === "FEMALE";
      const isO = genderVal === "O" || genderVal === "OTHER";

      const regNoDisplay = stu.id || "SEED001";
      const regDateDisplay = formatDisplayDate(meta.regDate) || new Date().toLocaleDateString("en-IN");
      const dobDisplay = formatDisplayDate(meta.dob) || "-";
      const placeDisplay = (meta.place || "ICHAPUR").toUpperCase();

      const qrData = encodeURIComponent(`https://seedling.co.in | ID: ${regNoDisplay} | Name: ${stu.name || ""}`);
      const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${qrData}`;

      container.innerHTML = `
        <div class="watermark">Academy of Seed</div>
        <div class="sheet-inner">
          <!-- Top Header matching admission_form.pdf -->
          <header class="top-header">
            <div class="logo-circle">
              <img src="https://seedling.co.in/image_1775846276193.jpg" alt="Seedling Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
              <div style="display:none; flex-direction:column; align-items:center; justify-content:center;">
                <span style="font-size:20px; font-weight:900; color:#1e8449; line-height:1;">Sa</span>
                <span style="font-size:7.5px; font-weight:800; color:#14365d; margin-top:2px;">SEEDLING</span>
              </div>
            </div>

            <div class="institute-title-block">
              <div class="kicker-line">ACADEMY OF SEED</div>
              <h1 class="main-title">SEEDLING INSTITUTE OF LEARNING</h1>
              <div class="tagline-pill">AN ORGANISATION PROVIDING QUALITY LEARNING</div>
              <div class="badges-row">
                <span>ISO 9001:2015</span>
                <span>MCA AUTHORISED</span>
                <span>MSME REGISTERED</span>
                <span>SKILL DEVELOPMENT &amp; FACILITATION</span>
              </div>
              <div class="address-line">
                ICHAPUR INDRAPURI, NEAR KALYAN SAMITI CLUB<br />
                Ph: 9007963615 / 9123971110 &bull; Email: seedling.learn@gmail.com &bull; Web: seedling.co.in
              </div>
            </div>

            <div class="qr-box" title="Verify Student Registration">
              <img src="${qrSrc}" alt="QR Code" />
            </div>
          </header>

          <!-- Registration Number, Reg Date & Student Photo -->
          <div class="reg-strip">
            <table class="reg-meta-table">
              <tr>
                <th>REG. NO</th>
                <td><strong style="font-size:13px; color:#14365d; letter-spacing:0.6px;">${regNoDisplay}</strong></td>
                <th>REG. DATE</th>
                <td><strong>${regDateDisplay}</strong></td>
              </tr>
              <tr>
                <th>NAME</th>
                <td colspan="3"><strong style="font-size:13px; text-transform:uppercase;">${stu.name || "-"}</strong></td>
              </tr>
              <tr>
                <th>DOB</th>
                <td>${dobDisplay}</td>
                <th>GENDER</th>
                <td>
                  <div class="gender-boxes">
                    <span class="g-box"><span class="g-check ${isM ? "checked" : ""}">${isM ? "✓" : ""}</span> M</span>
                    <span class="g-box"><span class="g-check ${isF ? "checked" : ""}">${isF ? "✓" : ""}</span> F</span>
                    <span class="g-box"><span class="g-check ${isO ? "checked" : ""}">${isO ? "✓" : ""}</span> O</span>
                  </div>
                </td>
              </tr>
              <tr>
                <th>PHONE</th>
                <td><strong>${formatPhoneWith91(meta.phone)}</strong></td>
                <th>EMAIL</th>
                <td>${meta.email || "-"}</td>
              </tr>
            </table>

            <div class="photo-frame">
              ${(stu.photo && stu.photo.dataUrl)
                ? `<img src="${stu.photo.dataUrl}" alt="${stu.name || "Student"}" />`
                : `<span>AFFIX<br />STUDENT<br />PHOTOGRAPH</span>`
              }
            </div>
          </div>

          <!-- Address, Identity, Course & Fee Breakdown matching PDF -->
          <table class="form-grid-table">
            <tr>
              <th style="width:18%;">ADDRESS</th>
              <td colspan="3">${meta.address || "-"}</td>
            </tr>
            <tr>
              <th>ID TYPE</th>
              <td style="width:32%;">${meta.idType || "-"}</td>
              <th style="width:18%;">ID NO.</th>
              <td style="width:32%;">${meta.idNo || "-"}</td>
            </tr>
            <tr>
              <th>COURSE NAME</th>
              <td><strong>${stu.course || "-"}</strong></td>
              <th>BATCH CODE</th>
              <td><strong>${meta.batchCode || "-"}</strong></td>
            </tr>
          </table>

          <div class="section-divider">Course Fees &amp; Payment Schedule</div>
          <table class="form-grid-table" style="margin-top:0;">
            <tr>
              <th style="width:18%;">COURSE FEES</th>
              <td style="width:32%;"><strong>${meta.courseFees || "-"}</strong></td>
              <th style="width:18%;">PAYMENT TYPE</th>
              <td style="width:32%;">${meta.paymentType || "-"}</td>
            </tr>
            <tr>
              <th>PAID AMOUNT</th>
              <td><strong style="color:#1e8449;">${meta.paidAmount || "-"}</strong></td>
              <th>NO OF EMI</th>
              <td><strong>${meta.noOfEmi || "-"}</strong></td>
            </tr>
            <tr>
              <th>REMAINING AMOUNT</th>
              <td><strong style="color:#c0392b;">${meta.remainingAmount || "-"}</strong></td>
              <th>EMI AMOUNT</th>
              <td><strong>${meta.emiAmount || "-"}</strong></td>
            </tr>
            <tr>
              <th>PAYMENT DETAILS</th>
              <td colspan="3">${meta.paymentDetails || "-"}</td>
            </tr>
            <tr>
              <th>REMARKS</th>
              <td colspan="3">${meta.remarks || "-"}</td>
            </tr>
          </table>

          <!-- Institute Declaration & Disclaimer from admission_form.pdf -->
          <div class="terms-box">
            <div><strong>&bull; Paid Fees are non-refundable.</strong></div>
            <div><strong class="warn">*** Trading &amp; Investment are subject to market risks.</strong> Seedling Institute of Learning provides training, do not suggest any Put-Call to enter in Market.</div>
            <div>&bull; For more details, visit our Website <strong>seedling.co.in</strong></div>
          </div>

          <!-- Bottom Date, Place: Ichapur & Signatures -->
          <div class="footer-sign-row">
            <div>
              <div>DATE : <strong>${regDateDisplay}</strong></div>
              <div style="margin-top:6px;">PLACE : <strong>${placeDisplay}</strong></div>
            </div>
            <div class="sign-line">Student / Guardian Signature</div>
            <div class="sign-line">Authorized Signatory</div>
          </div>

          <div class="thank-you-bar">
            Thank You! Keep Learning With Us . . .
          </div>
        </div>
      `;
    }

    function downloadAdmissionPDF() {
      const stu = getTargetStudent();
      const element = document.getElementById("admissionSheetContainer");
      const safeName = stu && stu.name
        ? `${stu.name.trim().replace(/\s+/g, "_").toUpperCase()}_${stu.id || "FORM"}_ADMISSION.pdf`
        : "SEEDLING_ADMISSION_FORM.pdf";

      html2pdf().set({
        margin: 6,
        filename: safeName,
        image: { type: "jpeg", quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
      }).from(element).save();
    }

    renderAdmissionSheet();
  </script>
</body>
</html>
