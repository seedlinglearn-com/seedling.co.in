<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Payment Bill | Seedling Institute of Learning</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --navy: #14365d;
      --green: #1e8449;
      --gold: #b7791f;
      --border: #1e293b;
      --tint: #f4f7fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 12px 40px;
      background: #e2e8f0;
      font-family: Arial, Helvetica, sans-serif;
      color: #111111;
    }

    .bill-toolbar {
      max-width: 800px;
      margin: 0 auto 14px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .bill-btn {
      border: none;
      border-radius: 4px;
      padding: 8px 14px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .bill-sheet {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      border: 2.5px solid var(--navy);
      padding: 20px 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .bill-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 2px solid var(--navy);
      padding-bottom: 12px;
    }

    .bill-emblem {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2.5px solid var(--green);
      background: #f3faf6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .bill-banner {
      background: var(--navy);
      color: #ffffff;
      text-align: center;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.9px;
      margin-top: 12px;
      text-transform: uppercase;
    }

    .bill-meta-strip {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-top: none;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 700;
    }

    table.bill-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }

    table.bill-table th,
    table.bill-table td {
      border: 1.5px solid var(--border);
      padding: 8px 10px;
      text-align: left;
    }

    table.bill-table th {
      background: var(--tint);
      color: var(--navy);
      font-weight: 800;
      text-transform: uppercase;
      font-size: 10.5px;
    }

    .num-col {
      text-align: right;
      font-weight: 700;
      width: 26%;
    }

    .net-row td {
      background: #eef3f8;
      font-weight: 900;
      font-size: 13px;
      color: var(--navy);
    }

    .bill-footer-note {
      margin-top: 10px;
      border: 1.5px solid var(--border);
      background: #fafafa;
      padding: 8px 10px;
      font-size: 10.5px;
      line-height: 1.45;
    }

    .bill-signatures {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 46px;
    }

    .bill-sig {
      width: 210px;
      border-top: 1.5px solid #111111;
      padding-top: 5px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .no-print {
        display: none !important;
      }
      .bill-sheet {
        max-width: 100%;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="bill-toolbar no-print">
    <strong style="color: var(--navy);"><i class="fas fa-file-invoice-dollar"></i> Employee Payment Bill</strong>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button type="button" onclick="window.print()" class="bill-btn" style="background: var(--navy);">
        <i class="fas fa-print"></i> Print Bill
      </button>
      <button type="button" onclick="downloadPaymentBillPdf()" class="bill-btn" style="background: var(--green);">
        <i class="fas fa-file-pdf"></i> Download PDF
      </button>
      <button type="button" onclick="window.close()" class="bill-btn" style="background: #64748b;">
        <i class="fas fa-times"></i> Close
      </button>
    </div>
  </div>

  <article id="employeePaymentBillSheet" class="bill-sheet"></article>

  <script>
    function formatCurrencyInr(amount) {
      const num = Number(amount) || 0;
      return Number.isInteger(num)
        ? `₹${num.toLocaleString("en-IN")}/-`
        : `₹${num.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}/-`;
    }

    function getEmployeeBillData() {
      const params = new URLSearchParams(window.location.search);
      const recParam = params.get("rec") || params.get("id");
      const records = JSON.parse(localStorage.getItem("seedling_employee_payments") || "[]");

      if (recParam) {
        const found = records.find(
          r => String(r.recordId || "").trim() === String(recParam).trim() ||
               String(r.employeeId || "").trim() === String(recParam).trim()
        );
        if (found) return found;
      }

      const active = JSON.parse(localStorage.getItem("active_employee_payslip") || "null");
      if (active) return active;

      return records[0] || null;
    }

    function renderEmployeePaymentBill() {
      const target = document.getElementById("employeePaymentBillSheet");
      const rec = getEmployeeBillData();

      if (!rec) {
        target.innerHTML = "<p style='padding: 16px;'>No employee payment bill record found.</p>";
        return;
      }

      const employees = JSON.parse(localStorage.getItem("seedling_employees") || "[]");
      const empInfo = employees.find(
        e => String(e.id || e.empId || "").trim() === String(rec.employeeId || "").trim()
      ) || {};

      const salary = Number(rec.salaryAmount) || 0;
      const incentive = Number(rec.incentiveAmount) || 0;
      const other = Number(rec.otherAmount) || 0;
      const totalPaid = Number(rec.totalAmount) || (salary + incentive + other);

      target.innerHTML = `
        <header class="bill-header">
          <div class="bill-emblem">
            <span style="font-size: 18px; font-weight: 900; color: var(--green); line-height: 1;"></span>
            <span style="font-size: 7.5px; font-weight: 800; color: var(--navy); margin-top: 2px;"><img src="https://seedling.co.in/image_1775846276193.jpg" height="75px" alt="Seedling Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" /></span>
          </div>

          <div style="text-align: center; flex: 1;">
            <div style="font-size: 10.5px; font-weight: 800; color: var(--green); letter-spacing: 0.6px;">ACADEMY OF SEED</div>
            <h1 style="margin: 2px 0; font-size: 18px; font-weight: 900; color: var(--navy);">SEEDLING INSTITUTE OF LEARNING</h1>
            <div style="font-size: 15px; color: #334155; line-height: 1.4;">
              ISO 9001:2015 Certified &bull; MSME Registered<br />
              Ichapur Indrapuri, Near Kalyan Samiti Club &bull; Ph: 9007963615 / 9123971110<br />
              Email: seedling.learn@gmail.com &bull; Web: seedling.co.in
            </div>
          </div>

          <div style="text-align: right; font-size: 10.5px; color: #334155;">
            <div><strong>BILL / VOUCHER NO.</strong></div>
            <div style="color: var(--navy); font-weight: 800;">${rec.recordId || "-"}</div>
          </div>
        </header>

        <div class="bill-banner">Employee Payment Bill / Disbursement Voucher</div>
        <div class="bill-meta-strip">
          <span>BILL NO: <strong>${rec.recordId || "-"}</strong></span>
          <span>PAY MONTH: <strong>${rec.monthKey || "-"}</strong></span>
          <span>PAYMENT DATE: <strong>${rec.paymentDate || "-"}</strong></span>
          <span>MODE: <strong>${rec.paymentMode || "-"}</strong></span>
        </div>

        <table class="bill-table">
          <tr>
            <th style="width: 20%;">Employee ID</th>
            <td style="width: 30%;"><strong>${rec.employeeId || "-"}</strong></td>
            <th style="width: 20%;">Employee Name</th>
            <td style="width: 30%;"><strong>${rec.employeeName || empInfo.name || "-"}</strong></td>
          </tr>
          <tr>
            <th>Role / Designation</th>
            <td>${rec.employeeRole || empInfo.role || "-"}</td>
            <th>Phone</th>
            <td>${empInfo.phone || "-"}</td>
          </tr>
        </table>

        <table class="bill-table">
          <thead>
            <tr>
              <th style="width: 10%;">Sl.</th>
              <th>Payment Head</th>
              <th>Notes / Details</th>
              <th class="num-col">Amount</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td><strong>Salary</strong></td>
              <td>Monthly / Base Salary</td>
              <td class="num-col" style="color: #1d4ed8;">${formatCurrencyInr(salary)}</td>
            </tr>
            <tr>
              <td>2</td>
              <td><strong>Incentive</strong></td>
              <td>Performance / Target Incentive</td>
              <td class="num-col" style="color: var(--green);">${formatCurrencyInr(incentive)}</td>
            </tr>
            <tr>
              <td>3</td>
              <td><strong>Other Payments</strong></td>
              <td>${rec.remarks || "Allowances / Reimbursement / Other"}</td>
              <td class="num-col" style="color: var(--gold);">${formatCurrencyInr(other)}</td>
            </tr>
            <tr class="net-row">
              <td colspan="3" style="text-align: right;">TOTAL PAYMENT BILL AMOUNT</td>
              <td class="num-col">${formatCurrencyInr(totalPaid)}</td>
            </tr>
          </tbody>
        </table>

        <div class="bill-footer-note">
          <strong>Remarks:</strong> ${rec.remarks || "Payment recorded against employee payroll ledger."}
        </div>

        <div class="bill-signatures">
          <div class="bill-sig">Employee Signature</div>
          <div class="bill-sig">Authorized Signatory</div>
        </div>
      `;
    }

    function downloadPaymentBillPdf() {
      const rec = getEmployeeBillData();
      const empSlug = rec && rec.employeeName
        ? rec.employeeName.trim().replace(/\s+/g, "_").toUpperCase()
        : "EMPLOYEE";
      const monthSlug = rec && rec.monthKey ? rec.monthKey : "BILL";

      html2pdf().set({
        margin: 8,
        filename: `${empSlug}_${monthSlug}_PAYMENT_BILL.pdf`,
        image: { type: "jpeg", quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
      }).from(document.getElementById("employeePaymentBillSheet")).save();
    }

    renderEmployeePaymentBill();
  </script>
</body>
</html>
